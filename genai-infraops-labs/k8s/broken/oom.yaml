# Lab 5.2 - planted fault: memory limit far too low for this workload
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-worker, namespace: portal, labels: {app: report-worker}}
spec:
  replicas: 1
  selector: {matchLabels: {app: report-worker}}
  template:
    metadata: {labels: {app: report-worker}}
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo building report cache; tail /dev/zero"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 32Mi}
